<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>

    <div class="theme-toggle">
      <span class="theme-toggle-label">DARK</span>
      <label class="switch">
        <input type="checkbox" id="theme-toggle" />
        <span class="slider"></span>
      </label>
      <span class="theme-toggle-label">LIGHT</span>
    </div>

    <div class="skin-select">
      <label class="theme-toggle-label" for="skin-select">SKIN</label>
      <select id="skin-select">
        <option value="retro">Retro</option>
        <option value="neon">Neon</option>
        <option value="pastel">Pastel</option>
        <option value="pixel">Pixel art</option>
      </select>
    </div>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <form id="name-form" hidden>
          <input id="name-input" maxlength="12" placeholder="Tu nombre" autocomplete="off" required />
          <button type="submit">Guardar</button>
        </form>
        <p class="label">TOP 5</p>
        <ol id="records-list"></ol>
        <p id="records-stats"></p>
        <button id="resume-btn" class="menu-btn pause-only">Reanudar</button>
        <button id="restart-btn" class="menu-btn">Jugar</button>
        <button id="controls-btn" class="menu-btn secondary pause-only">Ver controles</button>
        <ul id="controls-list" class="pause-only hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
        </ul>
        <label class="level-select">
          Nivel inicial
          <select id="start-level">
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          </select>
        </label>
        <button id="reset-records-btn" type="button">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
